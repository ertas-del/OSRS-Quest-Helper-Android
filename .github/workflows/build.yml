name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Phone-friendly mode: if you uploaded questoverlay.zip to the repo root
      # instead of the loose files, unpack it and build that.
      - name: Locate project
        run: |
          if [ -f questoverlay.zip ]; then
            mkdir -p _build
            unzip -q -o questoverlay.zip -d _build
            echo "PROJECT_DIR=_build/questoverlay" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          fi

      # Pull the newest quest steps from the RuneLite Quest Helper plugin.
      # If anything goes wrong, the quest list already in the project is used instead.
      - name: Refresh quest data
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/Zoinkwiz/quest-helper /tmp/qh
          python3 "$PROJECT_DIR/tools/convert_questhelper.py" /tmp/qh /tmp/quests.json
          NEW=$(python3 -c "import json;print(len(json.load(open('/tmp/quests.json'))['quests']))")
          echo "Converted $NEW quests"
          if [ "$NEW" -ge 150 ]; then
            cp /tmp/quests.json "$PROJECT_DIR/app/src/main/assets/quests.json"
          else
            echo "Too few quests converted, keeping the bundled list"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The GitHub runner already has the Android SDK installed (ANDROID_HOME is set),
      # so no separate Android setup step is needed. Gradle downloads anything missing.
      - name: Check Android SDK
        run: echo "Android SDK at $ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuestOverlay-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk

      # Direct-download link: Releases page -> "Latest build" -> app-debug.apk
      - name: Publish APK to the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Debug APK built from commit $GITHUB_SHA"
