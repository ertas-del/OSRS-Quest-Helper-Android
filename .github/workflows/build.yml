name: Build APK

on:
  push:
    # The download page in docs/ is published by GitHub Pages; editing it doesn't need a new APK.
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Switch to "true" to publish releases to the public downloads repo (ertas-del/Breadcrumbs)
  # instead of this one. Needs the PUBLIC_REPO_TOKEN secret with Contents: Read and write.
  PUBLISH_TO_PUBLIC_REPO: "false"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Phone-friendly mode: if you uploaded questoverlay.zip to the repo root
      # instead of the loose files, unpack it and build that.
      - name: Locate project
        run: |
          if [ -f questoverlay.zip ]; then
            mkdir -p _build
            unzip -q -o questoverlay.zip -d _build
            echo "PROJECT_DIR=_build/questoverlay" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          fi

      # Pull the newest quest steps from the RuneLite Quest Helper plugin.
      # If anything goes wrong, the quest list already in the project is used instead.
      - name: Refresh quest data
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/Zoinkwiz/quest-helper /tmp/qh
          python3 "$PROJECT_DIR/tools/convert_questhelper.py" /tmp/qh /tmp/quests.json
          NEW=$(python3 -c "import json;print(len(json.load(open('/tmp/quests.json'))['quests']))")
          echo "::notice::Converted $NEW quests"
          if [ "$NEW" -ge 150 ]; then
            cp /tmp/quests.json "$PROJECT_DIR/app/src/main/assets/quests.json"
          else
            echo "::warning::Too few quests converted, keeping the bundled list"
          fi

      # Pull the newest teleports, transports and walking map from the Shortest Path plugin.
      # If anything goes wrong, the travel data already in the project is used instead.
      - name: Refresh travel data
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/Skretzo/shortest-path /tmp/sp
          mkdir -p /tmp/travel
          python3 "$PROJECT_DIR/tools/convert_transports.py" /tmp/sp /tmp/travel
          LINKS=$(wc -l < /tmp/travel/transports.tsv)
          REGIONS=$(python3 -c "import zipfile;print(len(zipfile.ZipFile('/tmp/travel/collision-map.zip').namelist()))")
          echo "::notice::Converted $LINKS transport links and $REGIONS map regions"
          if [ "$LINKS" -ge 10000 ] && [ "$REGIONS" -ge 2400 ]; then
            cp /tmp/travel/transports.tsv /tmp/travel/collision-map.zip /tmp/travel/places.tsv "$PROJECT_DIR/app/src/main/assets/"
          else
            echo "::warning::Too few links converted, keeping the bundled travel data"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The GitHub runner already has the Android SDK installed (ANDROID_HOME is set),
      # so no separate Android setup step is needed. Gradle downloads anything missing.
      - name: Check Android SDK
        run: echo "Android SDK at $ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.11.1

      # The private release key lives encrypted in signing/release.jks.enc. The RELEASE_PASSWORD
      # secret (Settings > Secrets and variables > Actions) unlocks it. Without the secret the
      # build falls back to the shared debug key, exactly like before.
      - name: Prepare release signing
        id: signing
        env:
          RELEASE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
        run: |
          ENC="$PROJECT_DIR/signing/release.jks.enc"
          if [ -n "$RELEASE_PASSWORD" ] && [ -f "$ENC" ]; then
            if openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$ENC" \
                 -out "$RUNNER_TEMP/release.jks" -pass env:RELEASE_PASSWORD 2>/dev/null; then
              echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
              echo "signed=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Signing with the private release key"
              exit 0
            fi
            echo "::warning::RELEASE_PASSWORD didn't unlock signing/release.jks.enc; building with the debug key instead"
          else
            echo "::warning::No RELEASE_PASSWORD secret yet; building with the shared debug key"
          fi
          echo "signed=false" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          RELEASE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -o pipefail
          if [ "$SIGNED" = "true" ]; then
            # The APK for direct download, and the app bundle (.aab) Google Play wants uploaded.
            gradle assembleRelease bundleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Breadcrumbs.apk"
            cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/Breadcrumbs.aab"
          else
            gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/Breadcrumbs.apk"
          fi
          rm -f "$RUNNER_TEMP/release.jks"

      # Copy the important lines of a failed build into annotations, so they show on the
      # run's summary page (and can be read with `gh run view`) without opening the full log.
      - name: Summarise build errors
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/build.log"
          [ -f "$LOG" ] || exit 0
          grep -E "^e: |error:|What went wrong|Execution failed|Could not|FAILURE|AAPT|Exception" "$LOG" \
            | grep -v "^\s*at " | head -25 \
            | while IFS= read -r line; do
                clean=$(printf '%s' "$line" | sed 's/%/%25/g' | cut -c1-400)
                echo "::error::$clean"
              done
          echo "::error::Last lines: $(tail -5 "$LOG" | tr '\n' ' ' | cut -c1-400)"

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: Breadcrumbs-apk
          path: ${{ runner.temp }}/Breadcrumbs.apk

      - name: Upload Play Store bundle as a workflow artifact
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: Breadcrumbs-play-bundle
          path: ${{ runner.temp }}/Breadcrumbs.aab

      # Each build on main becomes a numbered release (v0.2.<run>) marked "Latest", so
      # .../releases/latest/download/Breadcrumbs.apk always points at the newest APK and
      # update checkers such as Obtainium see a real version number. Only the newest 10 are kept.
      # Needs Settings > Actions > General > Workflow permissions > "Read and write".
      # Readable crash reports need this file (it maps the scrambled names back). Kept private.
      - name: Upload R8 mapping as a workflow artifact
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: Breadcrumbs-r8-mapping
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

      # Releases go here, or to the public downloads repo (ertas-del/Breadcrumbs) when
      # PUBLISH_TO_PUBLIC_REPO is "true" (see the top of this file). Only the newest 10 are kept.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          OWN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          PUBLIC_REPO: ertas-del/Breadcrumbs
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          if [ "$PUBLISH_TO_PUBLIC_REPO" = "true" ] && [ -n "$PUBLIC_TOKEN" ]; then
            export GH_TOKEN="$PUBLIC_TOKEN"; TARGET="$PUBLIC_REPO"; TARGET_ARGS=()
          else
            export GH_TOKEN="$OWN_TOKEN"; TARGET="$GITHUB_REPOSITORY"; TARGET_ARGS=(--target "$GITHUB_SHA")
          fi
          VERSION="0.2.$GITHUB_RUN_NUMBER"
          SUBJECT=$(git log -1 --pretty=%s)
          if [ "$SIGNED" = "true" ]; then KEY="Signed with the Breadcrumbs release key."; else KEY="Signed with the shared debug key."; fi
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          $SUBJECT

          Download **Breadcrumbs.apk** below and open it on your phone. $KEY

          Created using intellectual property belonging to Jagex Limited under the terms of Jagex's Fan Content Policy. This content is not endorsed by or affiliated with Jagex.
          NOTES
          sed -i 's/^          //' "$RUNNER_TEMP/notes.md"
          # Public releases carry only the APK. The Play bundle stays in the run's artifacts.
          gh release create "v$VERSION" "$RUNNER_TEMP/Breadcrumbs.apk" \
            --repo "$TARGET" "${TARGET_ARGS[@]}" --latest \
            --title "Breadcrumbs $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          echo "::notice::Published Breadcrumbs $VERSION to $TARGET"
          gh release list --repo "$TARGET" --limit 100 --json tagName,createdAt \
            --jq 'map(select(.tagName | startswith("v0."))) | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
            | while read -r old; do gh release delete "$old" --yes --cleanup-tag --repo "$TARGET" || true; done
