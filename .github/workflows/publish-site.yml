name: Publish website

# Copies the website (docs/), the public README and the licence to the public downloads repo,
# so this source repo can stay private. Needs the PUBLIC_REPO_TOKEN secret: a fine-grained
# token with "Contents: Read and write" on ertas-del/Breadcrumbs only.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "public/**"
      - "LICENSE.md"
      - "NOTICE.md"
      - ".github/workflows/publish-site.yml"
  workflow_dispatch:

env:
  # Switch to "true" when the public downloads repo is ready (see build.yml).
  PUBLISH_TO_PUBLIC_REPO: "false"

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Copy the site to the public repo
        env:
          PUBLIC_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          PUBLIC_REPO: ertas-del/Breadcrumbs
        run: |
          if [ "$PUBLISH_TO_PUBLIC_REPO" != "true" ]; then
            echo "::notice::Public publishing is switched off; the website is served from this repo."
            exit 0
          fi
          if [ -z "$PUBLIC_TOKEN" ]; then
            echo "::notice::No PUBLIC_REPO_TOKEN secret yet; the website is still served from this repo."
            exit 0
          fi
          # Say clearly what's wrong with the token, since run logs aren't always easy to read.
          AUTH=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $PUBLIC_TOKEN" https://api.github.com/user)
          if [ "$AUTH" != "200" ]; then
            echo "::error::PUBLIC_REPO_TOKEN was rejected by GitHub (HTTP $AUTH). It may be mistyped, expired or deleted; make a new one."
            exit 1
          fi
          SEEN=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $PUBLIC_TOKEN" "https://api.github.com/repos/${PUBLIC_REPO}/contents/README.md")
          echo "::notice::Token is valid; reading ${PUBLIC_REPO} with it gave HTTP $SEEN"
          DEST="$RUNNER_TEMP/public"
          if ! git clone -q --depth 1 "https://x-access-token:${PUBLIC_TOKEN}@github.com/${PUBLIC_REPO}.git" "$DEST" 2> "$RUNNER_TEMP/clone.err"; then
            echo "::error::Couldn't clone ${PUBLIC_REPO}: $(head -c 300 "$RUNNER_TEMP/clone.err" | tr '\n' ' ' | sed "s/${PUBLIC_TOKEN}/***/g")"
            exit 1
          fi
          rm -rf "$DEST/docs"
          cp -R docs "$DEST/docs"
          cp public/README.md "$DEST/README.md"
          cp LICENSE.md NOTICE.md "$DEST/"
          mkdir -p "$DEST/.github" && cp .github/FUNDING.yml "$DEST/.github/FUNDING.yml"
          # Links to this (private) repo become links to the public one.
          find "$DEST/docs" -name '*.html' -print0 | xargs -0 sed -i \
            -e "s#ertas-del.github.io/OSRS-Quest-Helper-Android#ertas-del.github.io/Breadcrumbs#g" \
            -e "s#ertas-del/OSRS-Quest-Helper-Android#${PUBLIC_REPO}#g"
          cd "$DEST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::Website already up to date"
          else
            git commit -q -m "Update website from ${GITHUB_SHA::7}"
            if ! git push -q origin HEAD 2> "$RUNNER_TEMP/push.err"; then
              echo "::error::GitHub refused the push to ${PUBLIC_REPO}. The token needs Repository access: Breadcrumbs, and Contents: Read and write. Details: $(head -c 300 "$RUNNER_TEMP/push.err" | tr '\n' ' ' | sed "s/${PUBLIC_TOKEN}/***/g")"
              exit 1
            fi
            echo "::notice::Website copied to ${PUBLIC_REPO}"
          fi
